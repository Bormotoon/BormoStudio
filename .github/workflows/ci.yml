name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Studio smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Studio development dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Test Studio
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Lint Studio
        run: ruff check studio tools tests
      - name: Type-check Studio
        if: matrix.python-version == '3.12'
        run: mypy studio tools

  whispersync:
    name: Frozen WhisperSync baseline (403 tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/whispersync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: legacy/whispersync/requirements-dev.lock
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.lock
      - name: Run frozen baseline as a comparison set
        working-directory: .
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tools.legacy_suites run --suite whispersync --output legacy-reports
      - name: Keep per-test outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-whispersync
          path: legacy-reports

  forge:
    name: Frozen Forge baseline (620 tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: legacy/forge/requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.lock
      - name: Fetch the YuNet weights the face-tracking test compares against
        # Outside git: the snapshot expects them in assets/models (620 tests).
        run: |
          mkdir -p assets/models
          curl -fsSL -o assets/models/face_detection_yunet_2023mar.onnx \
            https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          echo "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4  assets/models/face_detection_yunet_2023mar.onnx" | sha256sum -c -
      - name: Run frozen baseline as a comparison set
        working-directory: .
        run: python -m tools.legacy_suites run --suite forge --output legacy-reports
      - name: Keep per-test outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-forge
          path: legacy-reports

  packaging:
    name: Wheel and PyInstaller smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Install media runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build distributions
        run: python -m build
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          python -m venv /tmp/studio-wheel
          /tmp/studio-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/studio-wheel/bin/studio --version
          /tmp/studio-wheel/bin/python -m studio.app --check-resources
          /tmp/studio-wheel/bin/python -c "from studio.app import packaged_resources; assert all(packaged_resources())"
      - name: Build and smoke-test the frozen executable
        run: |
          pyinstaller --noconfirm --clean packaging/pyinstaller/studio.spec
          dist/bormostudio --cli --version
          dist/bormostudio --check-resources
          dist/bormostudio --worker --help
          dist/bormostudio --cli doctor

  cross-platform:
    name: Installed artifact smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Studio
        run: python -m pip install --upgrade pip && pip install .
      - name: Check late imports and package resources
        run: python -c "import studio.app; assert all(studio.app.packaged_resources())"
